name: CI | Experimento A/B e parecer
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests -q
      - run: python src/experiment.py
      - run: python src/sensitivity.py
      - run: python src/decision_memo.py
      - run: python src/design_simulation.py --reps 300 --per-arm 500
      - run: python src/advanced_design.py --reps 100 --clusters 12 --size 10
